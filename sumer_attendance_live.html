<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطعم سومر | تسجيل الحضور والانصراف</title>
<style>
:root{--bg:#0d1218;--p:#151c24;--line:#29333e;--gold:#d9a441;--gold2:#f0c56b;--text:#f5f7fa;--muted:#9ba7b4;--green:#39d276;--red:#ff5d5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:23px;font-weight:bold;color:var(--gold2)}.muted{color:var(--muted);font-size:13px}.clock{font-size:29px;font-weight:bold}.date{color:var(--muted);font-size:12px;margin-top:4px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:linear-gradient(145deg,var(--p),#121820);border:1px solid var(--line);border-radius:20px;padding:22px}
h2{margin:0 0 6px}.select{width:100%;margin-top:18px;background:#0f151b;color:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px}
.employee{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px}.shiftInfo{margin-right:auto;text-align:left;color:var(--gold2);font-size:12px;line-height:1.6}.avatar{width:48px;height:48px;border-radius:50%;background:#303b47;display:grid;place-items:center;font-size:20px}.rate{margin-right:auto;text-align:left;color:var(--gold2);font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.btn{padding:16px;border-radius:13px;border:1px solid;font-weight:bold;font-size:16px;cursor:pointer}.in{background:#174d30;border-color:#3dcc72;color:#65ef96}.out{background:#522327;border-color:#e45252;color:#ff7777}.btn:disabled{opacity:.4;cursor:not-allowed}
.status{margin-top:14px;padding:12px;border-radius:12px;background:#1b232d;color:var(--muted);font-size:13px;text-align:center}
.item{display:grid;grid-template-columns:1.4fr .9fr .9fr .8fr;padding:13px 0;border-bottom:1px solid var(--line);gap:8px;font-size:12px}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold2)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.mini{background:#111820;border:1px solid var(--line);border-radius:13px;padding:13px}.mini b{display:block;font-size:19px;margin-top:5px}
.toast{position:fixed;bottom:20px;left:20px;background:#1d2a22;border:1px solid #3dcc72;color:#75ed9b;padding:14px 18px;border-radius:12px;display:none}
@media(max-width:750px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.clock{font-size:22px}.item{min-width:520px}.history{overflow:auto}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div><div class="brand">𒀭 مطعم سومر <span style="font-size:10px;color:#9ba7b4">v2</span></div><div class="muted">نظام الحضور والانصراف</div></div>
<div style="text-align:left"><div id="clock" class="clock">--:--:--</div><div id="date" class="date"></div></div>
</header>

<div class="grid">
<section class="card">
<h2>تسجيل الحضور والانصراف</h2><div class="muted">اختر الموظف ثم سجّل الدخول أو الخروج</div>
<select id="employee" class="select" onchange="refreshState()"><option>جاري تحميل الموظفين...</option></select>
<div id="employeeBox" class="employee" style="display:none">
<div id="avatar" class="avatar">؟</div><div><b id="name">—</b><div id="job" class="muted">—</div></div>
<div class="shiftInfo">الدوام<br><b id="shift">07:00 → 15:00</b></div>
<div class="rate"><span>أجر الساعة (دينار عراقي)</span><br><b id="rate">0 د.ع عراقي</b></div>
</div>
<div class="actions"><button id="inBtn" class="btn in" onclick="checkIn()">◉ &nbsp; تسجيل دخول</button><button id="outBtn" class="btn out" onclick="checkOut()">⇥ &nbsp; تسجيل خروج</button></div>
<div id="status" class="status">اختر موظفاً للبدء</div>
</section>

<aside class="card">
<h2>ملخص اليوم</h2><div class="muted">إجمالي حضور الموظفين اليوم</div>
<div class="summary"><div class="mini"><span class="muted">حاضر</span><b id="present">0</b></div><div class="mini"><span class="muted">ساعات</span><b id="hours">0</b></div><div class="mini"><span class="muted">الأجر</span><b id="pay">0</b></div></div>
<h2 style="margin-top:22px">آخر العمليات</h2>
<div class="history"><div id="logs"><div class="muted">جاري التحميل...</div></div></div>
</aside>
</div>
</div>
<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL="https://glbugvsorxtzixgexdak.supabase.co";
const SUPABASE_KEY="sb_publishable_8iv3CIQ3MaQ6E9oPgK6N8A_KTYGp-V6";
const API=SUPABASE_URL+"/rest/v1/";
const HEAD={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
let employees=[];

async function api(path,options={}){
  const r=await fetch(API+path,{...options,headers:{...HEAD,...(options.headers||{})}});
  const text=await r.text(); let data=null; try{data=text?JSON.parse(text):null}catch{}
  if(!r.ok) throw new Error((data&&data.message)||text||("HTTP "+r.status));
  return data;
}
function iraqDate(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Baghdad",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function fmtMoney(n){return Number(n||0).toLocaleString("ar-IQ")+" د.ع عراقي"}
function fmtTime(v){return v?new Date(v).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Baghdad"}):"—"}
function fmtMinutes(m){m=Math.max(0,Number(m||0));return Math.floor(m/60)+"س "+(m%60)+"د"}
function shiftEndFor(e,checkIn){
  const d=new Date(checkIn), [hh,mm,ss]=String(e.shift_end||"15:00:00").split(":").map(Number);
  const end=new Date(d); end.setHours(hh||0,mm||0,ss||0,0);
  const [sh,sm]=String(e.shift_start||"07:00:00").split(":").map(Number);
  if((hh||0)*60+(mm||0) <= (sh||0)*60+(sm||0)) end.setDate(end.getDate()+1);
  return end;
}
function cappedMinutes(e,checkIn,checkOut){
  if(!checkIn)return 0;
  const end=new Date(checkOut||new Date());
  const cap=shiftEndFor(e,checkIn);
  return Math.max(0,Math.floor((Math.min(end.getTime(),cap.getTime())-new Date(checkIn).getTime())/60000));
}
async function closeFinishedShifts(){
  try{
    const open=await api("attendance?select=id,employee_id,check_in,work_date&check_out=is.null&order=check_in.asc");
    const now=Date.now();
    for(const row of (open||[])){
      const e=employees.find(x=>x.id===row.employee_id);
      if(!e || !e.auto_checkout) continue;
      const end=shiftEndFor(e,row.check_in);
      if(now>=end.getTime()){
        const mins=cappedMinutes(e,row.check_in,end);
        await api("attendance?id=eq."+encodeURIComponent(row.id),{
          method:"PATCH",headers:{"Prefer":"return=minimal"},
          body:JSON.stringify({check_out:end.toISOString(),worked_minutes:mins,note:"خروج تلقائي عند انتهاء الدوام",updated_at:new Date().toISOString()})
        });
      }
    }
  }catch(e){console.error("auto close:",e)}
}
async function loadEmployees(){
  try{
    employees=await api("employees?select=id,employee_code,full_name,job_title,hourly_rate,daily_rate,is_active,shift_start,shift_end,auto_checkout&is_active=eq.true&order=full_name.asc");
    const el=document.getElementById("employee");
    el.innerHTML=employees.length?employees.map(x=>`<option value="${x.id}">${x.full_name} — ${x.job_title||"موظف"} — ${x.employee_code}</option>`).join(""):"<option value=''>لا يوجد موظفون فعالون</option>";
    await closeFinishedShifts();
    if(employees.length) await refreshState(); else {employeeBox.style.display="none";status.textContent="أضف موظفاً أولاً من صفحة الموظفين";}
    await loadToday(); await loadLogs();
  }catch(e){employee.innerHTML="<option>تعذر تحميل الموظفين</option>";status.textContent="خطأ: "+e.message;console.error(e)}
}
async function getOpen(id){const rows=await api(`attendance?select=*&employee_id=eq.${encodeURIComponent(id)}&check_out=is.null&order=check_in.desc&limit=1`);return rows?.[0]||null}
async function refreshState(){
  const id=employee.value,e=employees.find(x=>x.id===id);if(!e)return;
  employeeBox.style.display="flex";name.textContent=e.full_name;job.textContent=(e.job_title||"موظف")+" · "+e.employee_code;avatar.textContent=e.full_name[0];rate.textContent=fmtMoney(e.hourly_rate);
  shift.textContent=String(e.shift_start||"07:00:00").slice(0,5)+" → "+String(e.shift_end||"15:00:00").slice(0,5);
  await closeFinishedShifts();
  const open=await getOpen(id);
  inBtn.disabled=!!open;outBtn.disabled=!open;
  status.innerHTML=open?`<span class="green">● دوام مفتوح</span> — بدأ ${fmtTime(open.check_in)}`:"جاهز لتسجيل الدخول";
}
async function checkIn(){
  const id=employee.value;if(!id)return;
  const open=await getOpen(id);if(open){await refreshState();return}
  const now=new Date(),workDate=iraqDate();
  try{
    await api("attendance",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({employee_id:id,work_date:workDate,check_in:now.toISOString(),note:"تسجيل دخول"})});
    toast("تم تسجيل الدخول بنجاح ✓");await refreshState();await loadToday();await loadLogs();
  }catch(e){toast("فشل تسجيل الدخول: "+e.message)}
}
async function checkOut(){
  const id=employee.value;if(!id)return;
  const open=await getOpen(id);if(!open){await refreshState();return}
  const e=employees.find(x=>x.id===id),now=new Date(),end=e?.auto_checkout?shiftEndFor(e,open.check_in):now;
  const checkout=new Date(Math.min(now.getTime(),end.getTime())),mins=cappedMinutes(e||{},open.check_in,checkout);
  try{
    await api("attendance?id=eq."+encodeURIComponent(open.id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({check_out:checkout.toISOString(),worked_minutes:mins,note:"تسجيل خروج",updated_at:now.toISOString()})});
    toast("تم تسجيل الخروج وحساب الساعات ✓");await refreshState();await loadToday();await loadLogs();
  }catch(e){toast("فشل تسجيل الخروج: "+e.message)}
}
async function loadToday(){
  try{
    const today=iraqDate(),rows=await api(`attendance?select=*,employees(full_name,hourly_rate,shift_start,shift_end)&work_date=eq.${today}&order=check_in.desc`);
    present.textContent=new Set(rows.map(x=>x.employee_id)).size;
    const mins=rows.reduce((s,x)=>{const e=x.employees||{};return s+cappedMinutes(e,x.check_in,x.check_out||new Date())},0);
    hours.textContent=fmtMinutes(mins);
    const payValue=rows.reduce((s,x)=>{const e=x.employees||{};return s+(cappedMinutes(e,x.check_in,x.check_out||new Date())/60)*Number(e.hourly_rate||0)},0);
    pay.textContent=fmtMoney(Math.round(payValue));
  }catch(e){console.error(e)}
}
async function loadLogs(){
  try{
    const rows=await api("attendance?select=*,employees(full_name)&order=created_at.desc&limit=8");
    logs.innerHTML=rows.map(x=>`<div class="item"><span><b>${x.employees?.full_name||"—"}</b></span><span>${fmtTime(x.check_in)}</span><span>${fmtTime(x.check_out)}</span><span class="${x.check_out?"green":"gold"}">${x.check_out?fmtMinutes(x.worked_minutes):"مفتوح"}</span></div>`).join("")||'<div class="muted">لا توجد عمليات بعد</div>';
  }catch(e){logs.innerHTML='<div class="muted">تعذر تحميل السجل</div>';console.error(e)}
}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}
function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString("ar-IQ",{hour12:false,timeZone:"Asia/Baghdad"});date.textContent=d.toLocaleDateString("ar-IQ",{weekday:"long",year:"numeric",month:"long",day:"numeric",timeZone:"Asia/Baghdad"})}
tick();setInterval(tick,1000);loadEmployees();setInterval(async()=>{await closeFinishedShifts();await loadToday();await loadLogs();if(employee.value)await refreshState()},60000);

</script>
</body>
</html>
