<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مطعم سومر | بصمة الوجه</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.min.js"></script>
<style>
:root{--bg:#0b1016;--p:#151c24;--line:#29333e;--gold:#d9a441;--gold2:#f0c56b;--text:#f5f7fa;--muted:#9ba7b4;--green:#39d276;--red:#ff5d5d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#1b222b,#0b1016 55%);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:22px;font-weight:bold;color:var(--gold2)}.muted{color:var(--muted);font-size:12px}.device{color:var(--gold2);font-size:12px;margin-top:3px}.card{background:linear-gradient(145deg,var(--p),#111820);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.cam{position:relative;width:100%;aspect-ratio:4/3;background:#05080c;border-radius:18px;overflow:hidden;border:1px solid var(--line)}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.guide{position:absolute;inset:10% 20%;border:3px solid #d9a44188;border-radius:45%;box-shadow:0 0 0 9999px #0003;pointer-events:none}.scan{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--gold);box-shadow:0 0 14px var(--gold);opacity:.75;animation:scan 2s linear infinite}@keyframes scan{0%{top:22%}50%{top:78%}100%{top:22%}}.status{margin-top:12px;padding:13px;border-radius:13px;text-align:center;background:#111820;border:1px solid var(--line);color:var(--muted);min-height:45px}.ok{border-color:#2fae64;color:#70f19e;background:#14271c}.err{border-color:#a84040;color:#ff8585;background:#291619}.info{border-color:#6b5421;color:#f0c56b;background:#241e10}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{padding:14px;border-radius:13px;border:1px solid var(--line);background:#1a222b;color:#fff;font-weight:bold;font-size:15px}.btn.gold{background:#76571b;border-color:#d9a441}.btn.green{background:#174d30;border-color:#3dcc72}.btn.red{background:#522327;border-color:#e45252}.btn:disabled{opacity:.4}.result{text-align:center;padding:16px;display:none}.result .name{font-size:25px;font-weight:bold;color:var(--gold2)}.result .code{color:var(--muted);margin-top:4px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:#111820;border:1px solid var(--line);border-radius:13px;padding:12px}.mini b{display:block;font-size:18px;margin-top:4px}.toast{position:fixed;bottom:18px;left:18px;right:18px;max-width:520px;margin:auto;background:#1d2a22;border:1px solid #3dcc72;color:#75ed9b;padding:14px;border-radius:12px;display:none;text-align:center}.small{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}@media(max-width:600px){.actions{grid-template-columns:1fr}.guide{inset:12% 17%}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div><div class="brand">𒀭 مطعم سومر</div><div class="muted">نظام الحضور ببصمة الوجه</div></div>
 <div style="text-align:left"><div id="clock"></div><div id="device" class="device"></div></div>
</header>

<section class="card">
 <h2 style="margin:0 0 5px">التعرف على الموظف</h2>
 <div class="muted">وجّه وجه الموظف داخل الإطار — لا حاجة لاختيار الاسم يدوياً</div>
 <div class="cam" style="margin-top:14px">
   <video id="video" autoplay muted playsinline></video>
   <div class="guide"></div><div class="scan"></div>
 </div>
 <div id="status" class="status info">جاري تجهيز الكاميرا والتعرف على الوجوه...</div>
 <div class="actions">
   <button class="btn gold" id="startBtn" onclick="startCamera()">تشغيل الكاميرا</button>
   <button class="btn" id="stopBtn" onclick="stopCamera()" disabled>إيقاف</button>
 </div>
 <div id="result" class="result">
   <div class="name" id="resultName">—</div>
   <div class="code" id="resultCode">—</div>
   <div class="actions" style="margin-top:14px">
     <button class="btn green" id="inBtn" onclick="attendance('in')" disabled>تسجيل دخول</button>
     <button class="btn red" id="outBtn" onclick="attendance('out')" disabled>تسجيل خروج</button>
   </div>
 </div>
 <div class="small">التعرف يتم داخل الجهاز، وصورة الكاميرا لا يتم رفعها إلى الخادم.</div>
</section>

<section class="card">
 <h3 style="margin:0 0 12px">ملخص اليوم</h3>
 <div class="summary">
  <div class="mini"><span class="muted">حاضر</span><b id="present">0</b></div>
  <div class="mini"><span class="muted">ساعات</span><b id="hours">0</b></div>
  <div class="mini"><span class="muted">الأجر</span><b id="pay">0</b></div>
 </div>
</section>
</div>
<div id="toast" class="toast"></div>

<script>
const URL="https://glbugvsorxtzixgexdak.supabase.co";
const FN=URL+"/functions/v1/fingerprint-device-api";
const STORAGE="sumer_fingerprint_device_session_v1";
const MODEL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";
let employees=[],labeled=[],stream=null,recognitionTimer=null,selected=null,modelsReady=false,working=false;

function sess(){try{return JSON.parse(localStorage.getItem(STORAGE)||"null")}catch{return null}}
function setStatus(t,c="info"){const e=document.getElementById("status");e.textContent=t;e.className="status "+c}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("ar-IQ",{hour12:false,timeZone:"Asia/Baghdad"})}
async function call(action,extra={}){
 const s=sess();if(!s?.token)throw new Error("جلسة الجهاز غير موجودة");
 const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json","x-device-token":s.token},body:JSON.stringify({action,...extra})});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}
 if(!r.ok)throw new Error(d?.error||t||("HTTP "+r.status));return d;
}
async function verify(){
 try{const d=await call("employees");document.getElementById("device").textContent=(d.device.device_code||"")+" • "+(d.device.device_name||"جهاز البصمة");return d}
 catch(e){localStorage.removeItem(STORAGE);location.href="sumer_fingerprint_device_login_fixed.html";return null}
}
async function loadModels(){
 if(modelsReady)return;
 setStatus("جاري تحميل محرك التعرف على الوجه لأول مرة...");
 await Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri(MODEL),
  faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),
  faceapi.nets.faceRecognitionNet.loadFromUri(MODEL)
 ]);
 modelsReady=true;
}
function imageWithTimeout(url,ms=12000){
 return new Promise((resolve,reject)=>{
   const img=new Image();
   let done=false;
   const timer=setTimeout(()=>{if(!done){done=true;img.src="";reject(new Error("انتهى وقت تحميل صورة الوجه"))}},ms);
   img.crossOrigin="anonymous";
   img.onload=()=>{if(!done){done=true;clearTimeout(timer);resolve(img)}};
   img.onerror=()=>{if(!done){done=true;clearTimeout(timer);reject(new Error("تعذر تحميل صورة الوجه"))}};
   img.src=url;
 });
}
async function loadEmployees(){
 const d=await call("employees");employees=d.employees||[];
 const valid=employees.filter(x=>x.face_url);
 if(!valid.length)throw new Error("لا توجد صور وجه مسجلة للموظفين. أضف صور الوجوه من صفحة الموظفين أولاً.");
 labeled=[];
 let failed=0;
 for(let i=0;i<valid.length;i++){
   const e=valid[i];
   setStatus("جاري تجهيز بصمة الوجه "+(i+1)+" من "+valid.length+"...");
   try{
    const img=await imageWithTimeout(e.face_url,12000);
    const det=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.45})).withFaceLandmarks().withFaceDescriptor();
    if(det)labeled.push({e,descriptor:det.descriptor}); else failed++;
   }catch(err){failed++}
 }
 if(!labeled.length)throw new Error("لم أستطع تجهيز أي بصمة وجه. تأكد من أن صور الموظفين موجودة وواضحة.");
 setStatus("تم تجهيز "+labeled.length+" بصمة وجه ✓"+(failed?" — تعذر تجهيز "+failed:""),"ok");
}
async function startCamera(){
 try{
  if(!window.isSecureContext)throw new Error("الكاميرا تحتاج فتح الموقع عبر HTTPS.");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("هذا المتصفح لا يسمح بالوصول إلى الكاميرا من هذه الصفحة.");
  if(stream)return;
  // Camera MUST be requested first from the button click on iPhone Safari.
  setStatus("جاري طلب إذن الكاميرا من Safari...","info");
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  const video=document.getElementById("video");
  video.srcObject=stream;
  await video.play().catch(()=>{});
  document.getElementById("startBtn").disabled=true;
  document.getElementById("stopBtn").disabled=false;
  setStatus("الكاميرا تعمل ✓ — جاري تجهيز التعرف على الوجه...","info");

  await loadModels();
  if(!labeled.length)await loadEmployees();

  setStatus("جاهز ✓ — وجّه وجه الموظف داخل الإطار","ok");
  recognitionTimer=setInterval(recognize,900);
 }catch(e){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const name=e?.name?(" ["+e.name+"]"):"";
  setStatus((e?.message||"تعذر تشغيل الكاميرا")+name,"err");
 }
}
function stopCamera(){if(recognitionTimer){clearInterval(recognitionTimer);recognitionTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById("video").srcObject=null;document.getElementById("startBtn").disabled=false;document.getElementById("stopBtn").disabled=true}
async function recognize(){
 if(working||!stream||!modelsReady)return;
 const v=document.getElementById("video");if(v.readyState<3)return;
 const det=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();
 if(!det){setStatus("ضع الوجه داخل الإطار...");return}
 let best=null,bestDist=999;
 for(const x of labeled){const dist=faceapi.euclideanDistance(det.descriptor,x.descriptor);if(dist<bestDist){bestDist=dist;best=x}}
 if(!best||bestDist>.48){selected=null;document.getElementById("result").style.display="none";setStatus("لم يتم التعرف على الموظف — اقترب من الكاميرا قليلاً","err");return}
 selected=best.e;
 document.getElementById("resultName").textContent=selected.full_name;
 document.getElementById("resultCode").textContent=selected.employee_code+" • "+(selected.job_title||"موظف");
 document.getElementById("result").style.display="block";
 document.getElementById("inBtn").disabled=false;document.getElementById("outBtn").disabled=false;
 setStatus("تم التعرف على "+selected.full_name+" ✓","ok");
}
async function attendance(type){
 if(!selected)return;working=true;document.getElementById("inBtn").disabled=true;document.getElementById("outBtn").disabled=true;
 try{const d=await call("attendance",{type,employee_id:selected.id});toast(type==="in"?"تم تسجيل دخول "+selected.full_name+" ✓":"تم تسجيل خروج "+selected.full_name+" ✓");setStatus((type==="in"?"تم تسجيل الدخول":"تم تسجيل الخروج")+" بنجاح ✓","ok");await summary()}
 catch(e){setStatus(e.message||"فشل التسجيل","err")}
 finally{setTimeout(()=>{working=false;selected=null;document.getElementById("result").style.display="none"},1200)}
}
async function summary(){try{const d=await call("summary");document.getElementById("present").textContent=d.present;document.getElementById("hours").textContent=Math.floor(d.minutes/60)+"س "+(d.minutes%60)+"د";document.getElementById("pay").textContent=Number(d.pay||0).toLocaleString("ar-IQ")+" د.ع"}catch{}}
tick();setInterval(tick,1000);
(async()=>{
  const d=await verify();
  if(d){
    // Camera first: do not block camera startup on the 6+ MB AI model download.
    setStatus("اضغط «تشغيل الكاميرا» للسماح للآيفون بالكاميرا","info");
    document.getElementById("startBtn").disabled=false;
  }
})();
</script>
</body>
</html>
<!-- Camera compatibility note: camera is requested only from the button click. -->
