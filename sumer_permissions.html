<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطعم سومر | الصلاحيات</title><style>
:root{--bg:#0d1218;--p:#151c24;--line:#29333e;--gold:#d9a441;--gold2:#f0c56b;--text:#f5f7fa;--muted:#9ba7b4;--green:#39d276;--red:#ff5d5d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.brand{font-size:23px;font-weight:bold;color:var(--gold2)}.muted{color:var(--muted);font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:linear-gradient(145deg,var(--p),#121820);border:1px solid var(--line);border-radius:17px;padding:19px;margin-top:15px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:10px;padding:11px 17px;background:var(--gold);font-weight:bold;cursor:pointer}.btn.secondary{background:#222b34;color:#fff;border:1px solid var(--line)}select{width:100%;margin-top:13px;background:#10161d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.perms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.perm{display:flex;justify-content:space-between;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px}.switch{position:relative;width:45px;height:25px}.switch input{display:none}.slider{position:absolute;inset:0;background:#303943;border-radius:30px;cursor:pointer}.slider:before{content:"";position:absolute;width:19px;height:19px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#237a48}.switch input:checked+.slider:before{transform:translateX(-20px)}.notice{padding:13px;background:#211b11;border:1px solid #57451f;border-radius:12px;color:var(--gold2);font-size:11px;margin-top:14px}.status{margin-top:12px;color:var(--green);font-size:12px;min-height:18px}@media(max-width:650px){.wrap{padding:14px}.perms{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">𒀭 مطعم سومر</div><h1>الصلاحيات</h1><div class="muted">إدارة صلاحيات المستخدمين الفعلية</div></div><button class="btn secondary" onclick="logout()">تسجيل خروج</button></div><section class="card"><div class="head"><div><h2>المستخدمون</h2><div class="muted">اختر مستخدماً لتعديل صلاحياته</div></div><span id="me" class="muted"></span></div><select id="users"></select><div id="editor"></div><div id="status" class="status"></div></section></div><script src="sumer_auth.js"></script><script>
const P=[['attendance','🕐','الحضور والانصراف'],['employees','👥','الموظفين'],['reports','📊','التقارير'],['payroll','💰','الرواتب والأجور'],['settings','⚙️','الإعدادات'],['permissions','🔐','إدارة الصلاحيات']];let usersData=[];
async function logout(){await sumerSignOut();location.replace('sumer_login.html')}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function loadUsers(){const {data,error}=await sumerSupabase.from('profiles').select('id,full_name,role,is_active,employee_id').order('created_at',{ascending:true});if(error){status.textContent='تعذر تحميل المستخدمين: '+error.message;return}usersData=data||[];users.innerHTML=usersData.map(u=>`<option value="${u.id}">${esc(u.full_name||'مستخدم')} — ${u.role==='admin'?'مدير':'موظف'}${u.is_active?'':' — غير فعال'}</option>`).join('');users.onchange=renderUser;renderUser()}
async function renderUser(){const id=users.value,u=usersData.find(x=>x.id===id);if(!u)return;me.textContent=u.id===sumerProfile.id?'أنت الآن':' ';if(u.role==='admin'){editor.innerHTML='<div class="notice">هذا المستخدم مدير نظام، لذلك لديه جميع الصلاحيات دائماً.</div>';return}const {data,error}=await sumerSupabase.from('user_permissions').select('permission,allowed').eq('user_id',id);if(error){status.textContent='تعذر تحميل الصلاحيات: '+error.message;return}const map=new Map((data||[]).map(x=>[x.permission,x.allowed]));editor.innerHTML=`<div class="perms">${P.map(p=>`<div class="perm"><div><b>${p[1]} ${p[2]}</b><div class="muted">السماح بالوصول</div></div><label class="switch"><input id="p_${p[0]}" type="checkbox" ${map.get(p[0])?'checked':''}><span class="slider"></span></label></div>`).join('')}</div><button class="btn" style="margin-top:14px" onclick="saveUser()">💾 حفظ الصلاحيات</button>`;status.textContent=''}
async function saveUser(){const id=users.value,u=usersData.find(x=>x.id===id);if(!u||u.role==='admin')return;status.textContent='جاري الحفظ...';const rows=P.map(p=>({user_id:id,permission:p[0],allowed:document.getElementById('p_'+p[0]).checked,updated_at:new Date().toISOString()}));const {error}=await sumerSupabase.from('user_permissions').upsert(rows,{onConflict:'user_id,permission'});status.textContent=error?'فشل الحفظ: '+error.message:'تم حفظ الصلاحيات فعلياً ✓'}
sumerAuthReady.then(({profile})=>{if(!profile||profile.role!=='admin'){location.replace('index.html');return}loadUsers()});
</script></body></html>
