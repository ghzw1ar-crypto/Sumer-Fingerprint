<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطعم سومر | الصلاحيات</title><style>:root{--bg:#0d1218;--p:#151c24;--line:#29333e;--gold:#d9a441;--gold2:#f0c56b;--text:#f5f7fa;--muted:#9ba7b4;--green:#39d276}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.brand{font-size:23px;font-weight:bold;color:var(--gold2)}.muted{color:var(--muted);font-size:12px}.card{background:linear-gradient(145deg,var(--p),#121820);border:1px solid var(--line);border-radius:17px;padding:19px;margin-top:15px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0 0 5px}.btn{border:0;border-radius:10px;padding:11px 17px;background:var(--gold);font-weight:bold}.btn.secondary{background:#222b34;color:#fff;border:1px solid var(--line)}.row{display:grid;grid-template-columns:1.5fr repeat(7,1fr);min-width:850px;gap:8px;align-items:center;padding:12px 5px;border-top:1px solid var(--line);font-size:11px}.table{overflow:auto;margin-top:15px}.header{color:var(--muted);border-top:0}.center{text-align:center}.switch{position:relative;width:45px;height:25px;margin:auto}.switch input{display:none}.slider{position:absolute;inset:0;background:#303943;border-radius:30px}.slider:before{content:"";position:absolute;width:19px;height:19px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#237a48}.switch input:checked+.slider:before{transform:translateX(-20px)}.notice{padding:13px;background:#211b11;border:1px solid #57451f;border-radius:12px;color:var(--gold2);font-size:11px;margin-top:14px}.toast{position:fixed;bottom:20px;left:20px;background:#1d2a22;border:1px solid #3dcc72;color:#75ed9b;padding:13px 17px;border-radius:12px;display:none}@media(max-width:700px){.wrap{padding:14px}.head{align-items:flex-start;flex-direction:column}.row{min-width:850px}}</style></head><body><div class="wrap"><header><div class="brand">𒀭 مطعم سومر</div><h1>الصلاحيات</h1><div class="muted">إدارة صلاحيات الوصول إلى نظام المطعم</div></header><section class="card"><div class="head"><div><h2>المدير الرئيسي</h2><div class="muted">صلاحيات كاملة</div></div><b style="color:var(--green)">● فعال</b></div></section><section class="card"><div class="head"><div><h2>صلاحيات النظام</h2><div class="muted">تحديد الأقسام المسموح الوصول إليها</div></div><div><button class="btn" onclick="save()">💾 حفظ</button> <button class="btn secondary" onclick="resetAll()">استعادة</button></div></div><div class="notice">حالياً النظام يعمل بحساب المدير. هذه الإعدادات جاهزة لربطها لاحقاً مع Supabase Auth عند إضافة حسابات الموظفين.</div><div id="list"></div></section></div><div id="toast" class="toast"></div><script>const KEY="sumer_permissions_v1",P=[["attendance","🕐","الحضور والانصراف"],["employees","👥","الموظفين"],["reports","📊","التقارير"],["payroll","💰","الرواتب والأجور"],["settings","⚙️","الإعدادات"],["permissions","🔐","إدارة الصلاحيات"]];function toast(m){let e=document.getElementById("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}function render(){let x={};try{x=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}document.getElementById("list").innerHTML=P.map(p=>`<div class="row" style="grid-template-columns:45px 1fr 60px"><span style="font-size:20px">${p[1]}</span><div><b>${p[2]}</b><div class="muted">السماح بالوصول</div></div><label class="switch"><input id="p_${p[0]}" type="checkbox" ${x[p[0]]!==false?"checked":""}><span class="slider"></span></label></div>`).join("")}function save(){let x={};P.forEach(p=>x[p[0]]=document.getElementById("p_"+p[0]).checked);localStorage.setItem(KEY,JSON.stringify(x));toast("تم حفظ الصلاحيات ✓")}function resetAll(){localStorage.removeItem(KEY);render();toast("تمت استعادة الصلاحيات")}render();</script></body></html>
