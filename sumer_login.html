<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطعم سومر | تسجيل الدخول</title><style>
:root{--bg:#0b1118;--card:#151e28;--line:#2a3742;--gold:#d9a33f;--gold2:#efc56a;--text:#f4f5f7;--muted:#9ba8b5;--green:#45d878;--red:#ff5959}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18222c,#0b1118 55%);color:var(--text);font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:18px}.box{width:min(430px,100%);background:linear-gradient(145deg,#151e28,#111821);border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 18px 50px #0008}.brand{text-align:center;color:var(--gold2);font-size:25px;font-weight:bold}.sub{text-align:center;color:var(--muted);font-size:12px;margin:7px 0 22px}.field{display:grid;gap:7px;margin-top:13px}.field label{font-size:11px;color:var(--muted)}input{width:100%;padding:13px;background:#0e151d;color:#fff;border:1px solid var(--line);border-radius:11px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:var(--gold);font-weight:bold;font:inherit;cursor:pointer}.status{margin-top:13px;text-align:center;color:var(--red);font-size:12px;min-height:18px}.foot{text-align:center;color:var(--muted);font-size:10px;margin-top:18px}</style></head><body><main class="box"><div class="brand">𒀭 مطعم سومر</div><div class="sub">نظام إدارة الحضور والانصراف</div><form id="form"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button id="btn">تسجيل الدخول</button><div id="status" class="status"></div></form><div class="foot">الوصول محمي بواسطة Supabase Auth</div></main><script src="sumer_auth.js"></script><script>
const loginForm=document.getElementById('form');
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');
const loginBtn=document.getElementById('btn');
const loginStatus=document.getElementById('status');
sumerAuthReady.then(({session})=>{if(session)location.replace('index.html');}).catch(()=>{});
loginForm.addEventListener('submit',async e=>{
 e.preventDefault();loginStatus.textContent='جاري تسجيل الدخول...';loginBtn.disabled=true;
 try{
  const state=await sumerAuthReady;if(!state.client)throw new Error('تعذر الاتصال بنظام الدخول');
  const {error}=await state.client.auth.signInWithPassword({email:emailInput.value.trim(),password:passwordInput.value});
  if(error)throw error;location.replace('index.html');
 }catch(err){console.error(err);loginStatus.textContent='بيانات الدخول غير صحيحة أو الحساب غير فعال.';loginBtn.disabled=false;}
});
</script></body></html>
