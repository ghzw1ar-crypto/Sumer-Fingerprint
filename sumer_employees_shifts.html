<script>
/*
  Sumer - تثبيت رقم البصمة أثناء تعديل الموظف
  يوضع هذا السكربت بعد كود صفحة الموظفين وقبل </body>.
*/
(function () {
  const originalOpenM = window.openM;
  const originalEdit = window.edit;

  window.openM = function () {
    originalOpenM();
    const fp = document.getElementById("fingerprint");
    if (fp) {
      fp.value = "";
      fp.readOnly = false;
      fp.style.opacity = "1";
      fp.title = "أدخل رقم البصمة عند إضافة موظف جديد";
    }
  };

  window.edit = async function (id) {
    // افتح نافذة التعديل بنفس الصفحة الحالية.
    originalEdit(id);

    const fp = document.getElementById("fingerprint");
    if (!fp) return;

    // اقرأ رقم البصمة من نفس الموظف مباشرة من Supabase.
    try {
      const r = await fetch(
        API + "employees?id=eq." + encodeURIComponent(id) + "&select=fingerprint_key&limit=1",
        { headers: HEAD }
      );

      if (r.ok) {
        const rows = await r.json();
        const value = rows?.[0]?.fingerprint_key;
        fp.value = value == null ? "" : String(value);
      }
    } catch (e) {
      console.error("fingerprint:", e);
    }

    // لا تسمح بتغييره أثناء التعديل.
    fp.readOnly = true;
    fp.style.opacity = "0.75";
    fp.title = "رقم البصمة ثابت ولا يتغير عند تعديل الاسم أو الدوام";
  };

  // حماية إضافية: عند الحفظ، إذا كان الموظف قيد التعديل
  // وكانت خانة البصمة فارغة لأي سبب، استرجع القيمة الأصلية من Supabase
  // قبل استدعاء دالة الحفظ الأصلية.
  const originalSave = window.save;
  window.save = async function () {
    const fp = document.getElementById("fingerprint");

    if (window.editId && fp && !String(fp.value || "").trim()) {
      try {
        const r = await fetch(
          API + "employees?id=eq." + encodeURIComponent(window.editId) + "&select=fingerprint_key&limit=1",
          { headers: HEAD }
        );
        if (r.ok) {
          const rows = await r.json();
          const value = rows?.[0]?.fingerprint_key;
          if (value != null) fp.value = String(value);
        }
      } catch (e) {
        console.error("fingerprint preserve:", e);
      }
    }

    return originalSave();
  };
})();
</script>
